# Branch promotion — development→staging (auto-merge), staging→main (manual review PR)
when:
  - event: push
    branch: [development, staging]

depends_on:
  - ci

labels:
  platform: linux

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      depth: 0

steps:
  - name: promote
    image: bash
    commands:
      # GitHub App token (replaces static gh_token PAT) — peregrine-ci-app,
      # see peregrine-infrastructure/docs/operations/gh-app.md (#779)
      - gsutil cp gs://ci-runners-de-agent-hooks/scripts/get-gh-app-installation-token.sh /tmp/get-gh-token.sh
      - chmod +x /tmp/get-gh-token.sh
      - eval "$(/tmp/get-gh-token.sh)"
      - scripts/woodpecker/promote.sh

  - name: notify-status
    image: bash
    commands:
      - scripts/woodpecker/notify-status.sh
    when:
      - status: [success, failure]
    depends_on: [promote]
