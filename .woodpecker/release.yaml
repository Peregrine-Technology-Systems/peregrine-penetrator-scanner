# Production release: tag staging image as production (no build, no CI)
#
# #767: trigger flipped from `event: push, branch: main` to `event: deployment`
# (cross-repo rollout #1187). version-bump.sh POSTs the GitHub Deployment API
# after tag creation; the deployment webhook fires this pipeline.
when:
  - event: deployment

labels:
  platform: linux

steps:
  - name: promote-image
    image: bash
    environment:
      DOCKER_REGISTRY:
        from_secret: docker_registry
    commands:
      # GitHub App token (replaces static gh_token PAT) — peregrine-ci-app,
      # see peregrine-infrastructure/docs/operations/gh-app.md (#779)
      - gsutil cp gs://ci-runners-de-agent-hooks/scripts/get-gh-app-installation-token.sh /tmp/get-gh-token.sh
      - chmod +x /tmp/get-gh-token.sh
      - eval "$(/tmp/get-gh-token.sh)"
      - scripts/woodpecker/deploy.sh

  # #808: production smoke — verify the promoted scanner:production actually runs
  # (launches a smoke-test scan VM, asserts a fresh result in GCS). This is the
  # production-side smoke that smoke-test.yaml could never run on main (it
  # depends_on the staging-only deploy). A failure here marks the release failed.
  - name: smoke-test
    image: bash
    environment:
      GCP_PROJECT_DEV:
        from_secret: gcp_project_dev
      SLACK_WEBHOOK_URL:
        from_secret: slack_webhook_url
      NOTIFICATION_EMAIL:
        from_secret: notification_email
    commands:
      - scripts/woodpecker/smoke-test.sh
    depends_on: [promote-image]

  - name: notify-status
    image: bash
    environment:
      SLACK_WEBHOOK_URL:
        from_secret: slack_webhook_url
    commands:
      - scripts/woodpecker/notify-status.sh
    when:
      - status: [success, failure]
    depends_on: [smoke-test]
