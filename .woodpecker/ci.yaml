# Test & Lint — all branches except main + promotion artifacts
# (main is already tested on staging; merge/sync/release branches already
# passed CI on their source branch — MUST HAVE Rule #2)
when:
  - event: push
    branch:
      exclude: [main, "merge/*", "sync/*", "release/*"]

labels:
  platform: linux

steps:
  - name: check-release-notes
    image: bash
    commands:
      - scripts/woodpecker/check-release-notes.sh

  - name: check-sensitive
    image: bash
    commands:
      # Pre-publish lint: block infra hostnames / SA emails / private IPs /
      # internal buckets / cross-repo issue refs from entering this PUBLIC repo.
      # Scans ADDED lines only (pre-existing exposure is a separate cleanup).
      - |
        BASE=""
        if [ -n "${CI_PREV_COMMIT_SHA:-}" ] && git cat-file -e "${CI_PREV_COMMIT_SHA}^{commit}" 2>/dev/null; then
          BASE="${CI_PREV_COMMIT_SHA}"
        elif git cat-file -e "HEAD~1^{commit}" 2>/dev/null; then
          BASE="HEAD~1"
        fi
        if [ -n "$BASE" ]; then
          scripts/woodpecker/check-sensitive-content.sh --range "${BASE}..HEAD"
        else
          echo "check-sensitive: no parent commit available (shallow/first commit); skipping diff scan"
        fi
    depends_on: []

  - name: test
    image: bash
    environment:
      # Authenticates bundler's clone of the private peregrine_bus git-dep (#1009).
      GH_TOKEN:
        from_secret: gh_token
    commands:
      - scripts/woodpecker/test.sh
    depends_on: []

  - name: lint
    image: bash
    environment:
      GH_TOKEN:
        from_secret: gh_token
    commands:
      - scripts/woodpecker/lint.sh
    depends_on: []

  - name: notify-status
    image: bash
    commands:
      - scripts/woodpecker/notify-status.sh
    when:
      - status: [success, failure]
    depends_on: [check-release-notes, check-sensitive, test, lint]
