# Test & Lint — all branches except main + promotion artifacts
# (main is already tested on staging; merge/sync/release branches already
# passed CI on their source branch — MUST HAVE Rule #2)
when:
  - event: push
    branch:
      exclude: [main, "merge/*", "sync/*", "release/*"]

labels:
  platform: linux

steps:
  - name: check-release-notes
    image: bash
    commands:
      - scripts/woodpecker/check-release-notes.sh

  - name: test
    image: bash
    commands:
      - scripts/woodpecker/test.sh
    depends_on: []

  - name: lint
    image: bash
    commands:
      - scripts/woodpecker/lint.sh
    depends_on: []

  - name: test-cloud-functions
    image: bash
    commands:
      - scripts/woodpecker/test-cloud-functions.sh
    depends_on: []

  - name: notify-status
    image: bash
    environment:
      SLACK_WEBHOOK_URL:
        from_secret: slack_webhook_url
    commands:
      - scripts/woodpecker/notify-status.sh
    when:
      - status: [success, failure]
    depends_on: [check-release-notes, test, lint, test-cloud-functions]
