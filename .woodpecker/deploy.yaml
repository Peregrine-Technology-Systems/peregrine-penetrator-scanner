# Deploy staging: trigger scan with baked image (after build completes)
when:
  - event: push
    branch: staging

depends_on:
  - build

labels:
  platform: linux

steps:
  - name: deploy
    image: bash
    environment:
      DOCKER_REGISTRY:
        from_secret: docker_registry
    commands:
      - scripts/woodpecker/deploy.sh

  - name: notify-status
    image: bash
    commands:
      - scripts/woodpecker/notify-status.sh
    when:
      - status: [success, failure]
    depends_on: [deploy]
