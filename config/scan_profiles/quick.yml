name: quick
description: "Fast baseline scan - testssl + ZAP baseline + Nuclei + Nikto + retire.js + trufflehog + bounded sqlmap (~12 min)"
estimated_duration_minutes: 12
rate_limit: 10
phases:
  - name: discovery
    tools:
      - tool: testssl
        timeout: 90
        severity: HIGH
      - tool: retirejs
        timeout: 90
      - tool: trufflehog
        timeout: 90
    parallel: true
  - name: active_scan
    tools:
      - tool: zap
        mode: baseline
        timeout: 240
        delay_ms: 50
  - name: targeted
    tools:
      - tool: nuclei
        severity_filter: critical,high
        timeout: 150
        templates: []
        rate_limit: 15
        bulk_size: 8
      - tool: nikto
        timeout: 90
        tuning: "123b"
      - tool: sqlmap
        # Bounded scope (#1086): query-param URLs only, no --forms/--crawl — fast
        # SQLi triage on obvious injectable parameters.
        level: 1
        risk: 1
        timeout: 120
        threads: 1
    parallel: true
